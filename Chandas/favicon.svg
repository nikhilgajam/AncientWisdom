<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="60%" stop-color="#1e050d" />
      <stop offset="100%" stop-color="#090104" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Round-Rect -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Subtle Outer Cosmic Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.2" stroke-dasharray="4,3" />

  <!-- Meru Prastara Pyramid Silhouette (Subtle in background) -->
  <polygon points="64,22 96,82 32,82" fill="none" stroke="rgba(251, 113, 133, 0.35)" stroke-width="1.5" />
  <line x1="48" y1="52" x2="80" y2="52" stroke="rgba(251, 113, 133, 0.25)" stroke-width="1" />
  <line x1="40" y1="67" x2="88" y2="67" stroke="rgba(251, 113, 133, 0.25)" stroke-width="1" />

  <!-- Central Sanskrit Glyph: छं (Cham - Chandas) -->
  <text x="64" y="72" font-family="'Cinzel', 'Noto Sans Devanagari', 'Sanskrit Text', 'Arial Unicode MS', serif" font-size="44" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" filter="url(#glow)">छं</text>

  <!-- Laghu and Guru Prosody Symbols below: ⏑ (Laghu) and — (Guru) -->
  <!-- Laghu Crescent -->
  <path d="M 44,96 Q 52,105 60,96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <!-- Guru Bar -->
  <line x1="68" y1="100" x2="84" y2="100" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />

  <!-- Micro Starlight Sparkles -->
  <polygon points="64,14 65.5,18 70,19 65.5,20 64,24 62.5,20 58,19 62.5,18" fill="#fef08a" opacity="0.9" />
  <polygon points="26,42 27,45 30,46 27,47 26,50 25,47 22,46 25,45" fill="#fef08a" opacity="0.7" />
  <polygon points="102,42 103,45 106,46 103,47 102,50 101,47 98,46 101,45" fill="#fef08a" opacity="0.7" />
</svg>