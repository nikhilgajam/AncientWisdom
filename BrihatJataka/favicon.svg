<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f5b942"/>
      <stop offset="100%" stop-color="#b87d14"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f5b942" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
  <!-- 12 zodiacal spokes -->
  <g stroke="#f5b942" stroke-width="1" stroke-opacity="0.45">
    <line x1="32" y1="10" x2="32" y2="20"/>
    <line x1="32" y1="44" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="20" y2="32"/>
    <line x1="44" y1="32" x2="54" y2="32"/>
    <line x1="16.4" y1="16.4" x2="23.5" y2="23.5"/>
    <line x1="40.5" y1="40.5" x2="47.6" y2="47.6"/>
    <line x1="47.6" y1="16.4" x2="40.5" y2="23.5"/>
    <line x1="23.5" y1="40.5" x2="16.4" y2="47.6"/>
  </g>
  <!-- Central Surya / Hora Sun -->
  <circle cx="32" cy="32" r="6" fill="url(#goldGrad)"/>
  <circle cx="32" cy="32" r="2.5" fill="#06080d"/>
</svg>
