<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="sunBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <filter id="sunGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#f97316" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer background badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sunBg)" stroke="#f97316" stroke-width="2" stroke-opacity="0.85" />

  <!-- 12 Solar Rays (representing 12 Rashis / Solar months) -->
  <g transform="translate(32, 32)">
    <!-- 12 radiating diamond flares -->
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(30)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(60)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(90)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(120)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(150)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(180)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(210)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(240)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(270)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(300)" />
    <path d="M0,-24 L3,-16 L0,-14 L-3,-16 Z" fill="url(#sunGold)" transform="rotate(330)" />
  </g>

  <!-- Orbiting Epicycle dotted guide -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fde047" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Center Solar Core Disc -->
  <circle cx="32" cy="32" r="13" fill="url(#sunGold)" filter="url(#sunGlow)" />

  <!-- Devanagari Soo (सू) for Surya -->
  <text x="32" y="34" 
        font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI Historic', 'Arial Unicode MS', sans-serif" 
        font-weight="900" 
        font-size="18" 
        text-anchor="middle" 
        dominant-baseline="central" 
        fill="#0c0a09">सू</text>
</svg>
