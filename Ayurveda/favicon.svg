<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ayurGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="25%" stop-color="#6ee7b7" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="ayurBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="ayurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer background rounded container with emerald glowing border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ayurBg)" stroke="#34d399" stroke-width="2" stroke-opacity="0.85" />

  <!-- Botanical Leaf Contour in Background -->
  <path d="M32,10 C46,14 52,28 48,44 C44,52 36,54 32,54 C28,54 20,52 16,44 C12,28 18,14 32,10 Z" 
        fill="none" stroke="#6ee7b7" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Central Healing Leaf/Emblem Badge -->
  <circle cx="32" cy="32" r="19" fill="url(#ayurGrad)" filter="url(#ayurGlow)" />

  <!-- Devanagari Aa (आ) for Ayurveda -->
  <text x="32" y="34.5" 
        font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI Historic', 'Arial Unicode MS', sans-serif" 
        font-weight="900" 
        font-size="22" 
        text-anchor="middle" 
        dominant-baseline="central" 
        fill="#022c22">आ</text>

  <!-- Top Right Golden Amrita Nectar Droplet -->
  <path d="M48,12 C48,12 53,18 53,21 C53,23.5 50.8,25.5 48,25.5 C45.2,25.5 43,23.5 43,21 C43,18 48,12 48,12 Z" 
        fill="#fbbf24" opacity="0.95" />
</svg>
