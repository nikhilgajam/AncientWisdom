<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
    <linearGradient id="mathBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="mathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer background badge with cyan/gold border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mathBg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />

  <!-- Urdhva-Tiryagbhyam Crosswise Diagonal Laser Rays -->
  <line x1="14" y1="14" x2="50" y2="50" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />
  <line x1="50" y1="14" x2="14" y2="50" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Central Dynamic Diamond Badge -->
  <rect x="13" y="13" width="38" height="38" rx="10" transform="rotate(45 32 32)" fill="url(#mathGrad)" filter="url(#mathGlow)" />

  <!-- Devanagari Vai (वै) for Vedic Math -->
  <text x="32" y="34.5" 
        font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI Historic', 'Arial Unicode MS', sans-serif" 
        font-weight="900" 
        font-size="22" 
        text-anchor="middle" 
        dominant-baseline="central" 
        fill="#030712">वै</text>

  <!-- Top Right Lightning Spark -->
  <polygon points="50,8 44,20 48,20 42,30 54,17 49,17" fill="#ffd700" opacity="0.95" />
</svg>
